<!DOCTYPE html>
<html lang="tr">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <script>
        const savedTheme = localStorage.getItem('theme');
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (savedTheme === 'light' || (!savedTheme && !systemPrefersDark)) {
            document.documentElement.classList.add('light-mode');
            document.body && document.body.classList.add('light-mode');
        }

        const savedAccent = localStorage.getItem('custom_accent');
        const savedBg = localStorage.getItem('custom_bg');
        const savedText = localStorage.getItem('custom_text');

        if (savedAccent) document.documentElement.style.setProperty('--accent-color', savedAccent);
        if (savedBg) {
            document.documentElement.style.setProperty('--bg-color', savedBg);
            document.documentElement.style.setProperty('--card-bg', savedBg);
        }
        if (savedText) document.documentElement.style.setProperty('--text-color', savedText);

        const currentLang = localStorage.getItem('user_lang') || 'tr';
        if (currentLang === 'ar') {
            document.documentElement.setAttribute('dir', 'rtl');
        } else {
            document.documentElement.setAttribute('dir', 'ltr');
        }
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title data-i18n="page_title">Yakındaki Camiler | Ayetin Vakti</title>
    
    <style>
        :root {
            --bg-color: #0b1120;
            --card-bg: #1e293b;
            --accent-color: #10b981;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --btn-bg: rgba(255, 255, 255, 0.05);
            --btn-hover: rgba(255, 255, 255, 0.1);
        }

        html.light-mode, body.light-mode {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --accent-color: #059669;
            --text-color: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --btn-bg: #f1f5f9;
            --btn-hover: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container {
            width: 100%;
            max-width: 700px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .navbar {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
        }

        .home-btn, .theme-icon-btn {
            background-color: var(--btn-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        .home-btn:hover, .theme-icon-btn:hover {
            background-color: var(--btn-hover);
        }

        .app-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-color);
            text-align: center;
            flex: 1;
        }

        .control-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 14px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .action-btn {
            width: 100%;
            max-width: 320px;
            padding: 14px 20px;
            border-radius: 14px;
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s ease, transform 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
        }

        .action-btn.secondary {
            background-color: var(--btn-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            box-shadow: none;
        }

        .action-btn.secondary:hover {
            background-color: var(--btn-hover);
            border-color: var(--accent-color);
        }

        .action-btn:active {
            transform: scale(0.98);
        }

        .action-btn:hover {
            opacity: 0.9;
        }

        .status-text {
            font-size: 0.85rem;
            color: var(--text-muted);
            min-height: 20px;
        }

        .map-frame-container {
            width: 100%;
            height: 480px;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            display: none;
            position: relative;
            background-color: var(--card-bg);
            margin-top: 5px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .map-frame-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

<div class="container">
    <header class="navbar">
        <a href="../" class="home-btn" title="Ana Sayfa">←</a>
        <div class="app-title" data-i18n="app_title">Yakındaki Camiler</div>
        <button class="theme-icon-btn" onclick="toggleTheme()" id="theme-btn" title="Tema Değiştir">☀️</button>
    </header>

    <div class="control-card">
        <div style="font-size: 2.5rem;">🕌</div>
        <div style="font-size: 1.15rem; font-weight: 700; color: var(--accent-color);" data-i18n="card_title">Cami Bulucu</div>
        <div style="font-size: 0.9rem; color: var(--text-muted);" data-i18n="card_desc">
            Mahallenizdeki tüm camileri ve mescitleri harita üzerinde anında listeleyin.
        </div>
        
        <button class="action-btn" onclick="findNearbyMosquesSmart()">
            <span>📍</span> <span data-i18n="find_btn">Çevremdeki Camileri Listele</span>
        </button>

        <button class="action-btn secondary" onclick="openDirectMaps()">
            <span>🗺️</span> <span data-i18n="map_btn">Harita Uygulamasında Tam Ekran Aç</span>
        </button>
        
        <div class="status-text" id="statusText"></div>
    </div>

    <!-- Doğrudan sayfa içerisinde en güncel Google cami verilerini gösteren akıllı çerçeve -->
    <div class="map-frame-container" id="mapFrameContainer">
        <iframe id="googleMapFrame" src="" allowfullscreen="" loading="lazy"></iframe>
    </div>
</div>

<script>
    const translations = {
        tr: {
            page_title: "Yakındaki Camiler | Ayetin Vakti",
            app_title: "Yakındaki Camiler",
            card_title: "Cami Bulucu",
            card_desc: "Mahallenizdeki tüm camileri ve mescitleri harita üzerinde anında listeleyin.",
            find_btn: "Çevremdeki Camileri Listele",
            map_btn: "Harita Uygulamasında Tam Ekran Aç",
            loc_error: "Konum alınamadı. Lütfen konum izinlerini kontrol edin.",
            loc_getting: "Konumunuz alınıyor ve mahalle taranıyor..."
        },
        en: {
            page_title: "Nearby Mosques | Ayetin Vakti",
            app_title: "Nearby Mosques",
            card_title: "Mosque Finder",
            card_desc: "Instantly list all mosques and masjids in your neighborhood.",
            find_btn: "List Mosques Around Me",
            map_btn: "Open Fullscreen in Map App",
            loc_error: "Could not get location. Please check permissions.",
            loc_getting: "Getting your location and scanning neighborhood..."
        },
        ar: {
            page_title: "المساجد القريبة | آية الوقت",
            app_title: "المساجد القريبة",
            card_title: "البحث عن المساجد",
            card_desc: "سرد جميع المساجد والمصليات في حيك فوراً على الخريطة.",
            find_btn: "عرض المساجد القريبة مني",
            map_btn: "فتح بشاشة كاملة في تطبيق الخرائط",
            loc_error: "تعذر الحصول على الموقع. يرجى التحقق من الأذونات.",
            loc_getting: "جاري تحديد موقعك وفحص الحي..."
        }
    };

    const activeLang = localStorage.getItem('user_lang') || 'tr';
    const t = translations[activeLang] || translations['tr'];

    function updateThemeButton(isLight) {
        const btn = document.getElementById('theme-btn');
        if (btn) btn.textContent = isLight ? '☀️' : '🌙';
    }

    function initTheme() {
        const savedTheme = localStorage.getItem('theme');
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const isLight = (savedTheme === 'light') || (!savedTheme && !systemPrefersDark);
        applyTheme(isLight);
    }

    function toggleTheme() {
        const isLight = document.documentElement.classList.contains('light-mode');
        applyTheme(!isLight);
    }

    function applyTheme(isLight) {
        if (isLight) {
            document.documentElement.classList.add('light-mode');
            document.body.classList.add('light-mode');
            localStorage.setItem('theme', 'light');
        } else {
            document.documentElement.classList.remove('light-mode');
            document.body.classList.remove('light-mode');
            localStorage.setItem('theme', 'dark');
        }
        updateThemeButton(isLight);
    }

    function init() {
        initTheme();
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (t[key]) {
                if (el.tagName === 'TITLE') document.title = t[key];
                else el.textContent = t[key];
            }
        });
    }

    function openDirectMaps() {
        if (!navigator.geolocation) {
            window.location.href = "https://www.google.com/maps/search/cami";
            return;
        }
        navigator.geolocation.getCurrentPosition(
            (pos) => {
                window.location.href = `https://www.google.com/maps/search/cami/@${pos.coords.latitude},${pos.coords.longitude},16z`;
            },
            () => {
                window.location.href = "https://www.google.com/maps/search/cami";
            },
            { timeout: 5000, enableHighAccuracy: false }
        );
    }

    function findNearbyMosquesSmart() {
        const statusEl = document.getElementById('statusText');
        const frameContainer = document.getElementById('mapFrameContainer');
        const mapFrame = document.getElementById('googleMapFrame');
        
        if (!navigator.geolocation) {
            statusEl.textContent = t.loc_error;
            return;
        }

        statusEl.textContent = t.loc_getting;
        frameContainer.style.display = 'none';

        navigator.geolocation.getCurrentPosition(
            (position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                
                statusEl.textContent = "";
                // Kullanıcının tam enlem ve boylamına odaklanarak Google Maps cami veritabanını doğrudan yüklüyoruz
                mapFrame.src = `https://maps.google.com/maps?q=cami&sll=${lat},${lon}&sspn=0.01,0.01&t=m&z=17&output=embed`;
                frameContainer.style.display = 'block';
                
                // Sayfayı otomatik olarak harita alanına kaydır
                frameContainer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            },
            (error) => {
                statusEl.textContent = t.loc_error;
            },
            { timeout: 10000, enableHighAccuracy: true }
        );
    }

    document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
