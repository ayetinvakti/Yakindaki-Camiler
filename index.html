<!DOCTYPE html>
<html lang="tr">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <script>
        const savedTheme = localStorage.getItem('theme');
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (savedTheme === 'light' || (!savedTheme && !systemPrefersDark)) {
            document.documentElement.classList.add('light-mode');
            document.body && document.body.classList.add('light-mode');
        }

        const savedAccent = localStorage.getItem('custom_accent');
        const savedBg = localStorage.getItem('custom_bg');
        const savedText = localStorage.getItem('custom_text');

        if (savedAccent) document.documentElement.style.setProperty('--accent-color', savedAccent);
        if (savedBg) {
            document.documentElement.style.setProperty('--bg-color', savedBg);
            document.documentElement.style.setProperty('--card-bg', savedBg);
        }
        if (savedText) document.documentElement.style.setProperty('--text-color', savedText);

        const currentLang = localStorage.getItem('user_lang') || 'tr';
        if (currentLang === 'ar') {
            document.documentElement.setAttribute('dir', 'rtl');
        } else {
            document.documentElement.setAttribute('dir', 'ltr');
        }
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title data-i18n="page_title">Yakındaki Camiler | Ayetin Vakti</title>
    
    <style>
        :root {
            --bg-color: #0b1120;
            --card-bg: #1e293b;
            --accent-color: #10b981;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --btn-bg: rgba(255, 255, 255, 0.05);
            --btn-hover: rgba(255, 255, 255, 0.1);
        }

        html.light-mode, body.light-mode {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --accent-color: #059669;
            --text-color: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --btn-bg: #f1f5f9;
            --btn-hover: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container {
            width: 100%;
            max-width: 700px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .navbar {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
        }

        .home-btn, .theme-icon-btn {
            background-color: var(--btn-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        .home-btn:hover, .theme-icon-btn:hover {
            background-color: var(--btn-hover);
        }

        .app-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-color);
            text-align: center;
            flex: 1;
        }

        .control-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 14px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .action-btn {
            width: 100%;
            max-width: 320px;
            padding: 14px 20px;
            border-radius: 14px;
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s ease, transform 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
        }

        .action-btn:active {
            transform: scale(0.98);
        }

        .action-btn:hover {
            opacity: 0.9;
        }

        .status-text {
            font-size: 0.85rem;
            color: var(--text-muted);
            min-height: 20px;
        }

        .mosque-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .mosque-item {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            transition: border-color 0.2s ease;
        }

        .mosque-item:hover {
            border-color: var(--accent-color);
        }

        .mosque-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            text-align: left;
            flex: 1;
        }

        [dir="rtl"] .mosque-info {
            text-align: right;
        }

        .mosque-name {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-color);
        }

        .mosque-distance {
            font-size: 0.85rem;
            color: var(--accent-color);
            font-weight: 600;
        }

        .direction-btn {
            background-color: var(--btn-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
        }

        .direction-btn:hover {
            background-color: var(--btn-hover);
            border-color: var(--accent-color);
        }
    </style>
</head>
<body>

<div class="container">
    <header class="navbar">
        <a href="../" class="home-btn" title="Ana Sayfa">←</a>
        <div class="app-title" data-i18n="app_title">Yakındaki Camiler</div>
        <button class="theme-icon-btn" onclick="toggleTheme()" id="theme-btn" title="Tema Değiştir">☀️</button>
    </header>

    <div class="control-card">
        <div style="font-size: 2.5rem;">🕌</div>
        <div style="font-size: 1.15rem; font-weight: 700; color: var(--accent-color);" data-i18n="card_title">Dahili Cami Bulucu</div>
        <div style="font-size: 0.9rem; color: var(--text-muted);" data-i18n="card_desc">
            Bulunduğunuz konumu tarayarak çevrenizdeki camileri anında listeleyin.
        </div>
        
        <button class="action-btn" onclick="findNearbyMosquesInternal()">
            <span>📍</span> <span data-i18n="find_btn">Çevremdeki Camileri Listele</span>
        </button>
        
        <div class="status-text" id="statusText"></div>
    </div>

    <div class="mosque-list" id="mosqueListContainer"></div>
</div>

<script>
    const translations = {
        tr: {
            page_title: "Yakındaki Camiler | Ayetin Vakti",
            app_title: "Yakındaki Camiler",
            card_title: "Dahili Cami Bulucu",
            card_desc: "Bulunduğunuz konumu tarayarak çevrenizdeki camileri anında listeleyin.",
            find_btn: "Çevremdeki Camileri Listele",
            loc_error: "Konum alınamadı. Lütfen konum izinlerini kontrol edin.",
            loc_getting: "Konumunuz alınıyor ve camiler taranıyor...",
            no_mosque: "Yakınınızda cami bulunamadı.",
            dir_btn: "Yol Tarifi"
        },
        en: {
            page_title: "Nearby Mosques | Ayetin Vakti",
            app_title: "Nearby Mosques",
            card_title: "Internal Mosque Finder",
            card_desc: "Scan your location to instantly list mosques around you.",
            find_btn: "List Mosques Around Me",
            loc_error: "Could not get location. Please check permissions.",
            loc_getting: "Getting your location and scanning mosques...",
            no_mosque: "No mosques found nearby.",
            dir_btn: "Directions"
        },
        ar: {
            page_title: "المساجد القريبة | آية الوقت",
            app_title: "المساجد القريبة",
            card_title: "البحث الداخلي عن المساجد",
            card_desc: "قم بمسح موقعك لسرد المساجد من حولكon فوراً.",
            find_btn: "عرض المساجد القريبة مني",
            loc_error: "تعذر الحصول على الموقع. يرجى التحقق من الأذونات.",
            loc_getting: "جاري تحديد موقعك وفحص المساجد...",
            no_mosque: "لم يتم العثور على مساجد قريبة.",
            dir_btn: "الاتجاهات"
        }
    };

    const activeLang = localStorage.getItem('user_lang') || 'tr';
    const t = translations[activeLang] || translations['tr'];

    function updateThemeButton(isLight) {
        const btn = document.getElementById('theme-btn');
        if (btn) btn.textContent = isLight ? '☀️' : '🌙';
    }

    function initTheme() {
        const savedTheme = localStorage.getItem('theme');
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const isLight = (savedTheme === 'light') || (!savedTheme && !systemPrefersDark);
        applyTheme(isLight);
    }

    function toggleTheme() {
        const isLight = document.documentElement.classList.contains('light-mode');
        applyTheme(!isLight);
    }

    function applyTheme(isLight) {
        if (isLight) {
            document.documentElement.classList.add('light-mode');
            document.body.classList.add('light-mode');
            localStorage.setItem('theme', 'light');
        } else {
            document.documentElement.classList.remove('light-mode');
            document.body.classList.remove('light-mode');
            localStorage.setItem('theme', 'dark');
        }
        updateThemeButton(isLight);
    }

    function init() {
        initTheme();
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (t[key]) {
                if (el.tagName === 'TITLE') document.title = t[key];
                else el.textContent = t[key];
            }
        });
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 6371; // Dünya yarıçapı (km)
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = 
            Math.sin(dLat/2) * Math.sin(dLat/2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
            Math.sin(dLon/2) * Math.sin(dLon/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return R * c; // km cinsinden mesafe
    }

    function findNearbyMosquesInternal() {
        const statusEl = document.getElementById('statusText');
        const container = document.getElementById('mosqueListContainer');
        
        if (!navigator.geolocation) {
            statusEl.textContent = t.loc_error;
            return;
        }

        statusEl.textContent = t.loc_getting;
        container.innerHTML = '';

        navigator.geolocation.getCurrentPosition(
            async (position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                
                try {
                    // OpenStreetMap Overpass API ile 3 km yarıçapındaki camileri çekiyoruz
                    const query = `[out:json];node(around:3000,${lat},${lon})[amenity=place_of_worship][religion=muslim];out;`;
                    const response = await fetch('https://overpass-api.de/api/interpreter', {
                        method: 'POST',
                        body: query
                    });
                    
                    const data = await response.json();
                    statusEl.textContent = "";

                    if (!data.elements || data.elements.length === 0) {
                        container.innerHTML = `<div style="text-align:center; color:var(--text-muted); padding:20px;">${t.no_mosque}</div>`;
                        return;
                    }

                    // Camileri mesafelerine göre hesaplayıp sıralıyoruz
                    let mosques = data.elements.map(item => {
                        const mLat = item.lat;
                        const mLon = item.lon;
                        const name = (item.tags && (item.tags.name || item.tags['name:tr'])) || "İsimsiz Cami";
                        const dist = calculateDistance(lat, lon, mLat, mLon);
                        return { name, dist, lat: mLat, lon: mLon };
                    });

                    mosques.sort((a, b) => a.dist - b.dist);

                    let html = '';
                    mosques.forEach(m => {
                        const distFormatted = m.dist < 1 ? `${Math.round(m.dist * 1000)} m` : `${m.dist.toFixed(1)} km`;
                        const mapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${m.lat},${m.lon}`;

                        html += `
                            <div class="mosque-item">
                                <div class="mosque-info">
                                    <div class="mosque-name">🕌 ${m.name}</div>
                                    <div class="mosque-distance">${distFormatted}</div>
                                </div>
                                <a href="${mapsUrl}" target="_blank" class="direction-btn">
                                    <span>🧭</span> ${t.dir_btn}
                                </a>
                            </div>
                        `;
                    });

                    container.innerHTML = html;

                } catch (err) {
                    statusEl.textContent = t.loc_error;
                }
            },
            (error) => {
                statusEl.textContent = t.loc_error;
            },
            { timeout: 10000, enableHighAccuracy: true }
        );
    }

    document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
