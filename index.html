<!DOCTYPE html>
<html lang="tr">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <script>
        const savedTheme = localStorage.getItem('theme');
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (savedTheme === 'light' || (!savedTheme && !systemPrefersDark)) {
            document.documentElement.classList.add('light-mode');
            document.body && document.body.classList.add('light-mode');
        }

        const savedAccent = localStorage.getItem('custom_accent');
        const savedBg = localStorage.getItem('custom_bg');
        const savedText = localStorage.getItem('custom_text');

        if (savedAccent) document.documentElement.style.setProperty('--accent-color', savedAccent);
        if (savedBg) {
            document.documentElement.style.setProperty('--bg-color', savedBg);
            document.documentElement.style.setProperty('--card-bg', savedBg);
        }
        if (savedText) document.documentElement.style.setProperty('--text-color', savedText);

        const currentLang = localStorage.getItem('user_lang') || 'tr';
        if (currentLang === 'ar') {
            document.documentElement.setAttribute('dir', 'rtl');
        } else {
            document.documentElement.setAttribute('dir', 'ltr');
        }
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title data-i18n="page_title">Yakındaki Camiler | Ayetin Vakti</title>
    
    <style>
        :root {
            --bg-color: #0b1120;
            --card-bg: #1e293b;
            --accent-color: #10b981;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --btn-bg: rgba(255, 255, 255, 0.05);
            --btn-hover: rgba(255, 255, 255, 0.1);
        }

        html.light-mode, body.light-mode {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --accent-color: #059669;
            --text-color: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --btn-bg: #f1f5f9;
            --btn-hover: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container {
            width: 100%;
            max-width: 700px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .navbar {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
        }

        .home-btn, .theme-icon-btn {
            background-color: var(--btn-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        .home-btn:hover, .theme-icon-btn:hover {
            background-color: var(--btn-hover);
        }

        .app-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-color);
            text-align: center;
            flex: 1;
        }

        .control-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 14px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .action-btn {
            width: 100%;
            max-width: 320px;
            padding: 14px 20px;
            border-radius: 14px;
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s ease, transform 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
        }

        .action-btn.secondary {
            background-color: var(--btn-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            box-shadow: none;
        }

        .action-btn.secondary:hover {
            background-color: var(--btn-hover);
            border-color: var(--accent-color);
        }

        .action-btn:active {
            transform: scale(0.98);
        }

        .action-btn:hover {
            opacity: 0.9;
        }

        .status-text {
            font-size: 0.85rem;
            color: var(--text-muted);
            min-height: 20px;
        }

        .mosque-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .mosque-item {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            transition: border-color 0.2s ease;
        }

        .mosque-item:hover {
            border-color: var(--accent-color);
        }

        .mosque-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            text-align: left;
            flex: 1;
        }

        [dir="rtl"] .mosque-info {
            text-align: right;
        }

        .mosque-name {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-color);
        }

        .mosque-distance {
            font-size: 0.85rem;
            color: var(--accent-color);
            font-weight: 600;
        }

        .direction-btn {
            background-color: var(--btn-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
        }

        .direction-btn:hover {
            background-color: var(--btn-hover);
            border-color: var(--accent-color);
        }
    </style>
</head>
<body>

<div class="container">
    <header class="navbar">
        <a href="../" class="home-btn" title="Ana Sayfa">←</a>
        <div class="app-title" data-i18n="app_title">Yakındaki Camiler</div>
        <button class="theme-icon-btn" onclick="toggleTheme()" id="theme-btn" title="Tema Değiştir">☀️</button>
    </header>

    <div class="control-card">
        <div style="font-size: 2.5rem;">🕌</div>
        <div style="font-size: 1.15rem; font-weight: 700; color: var(--accent-color);" data-i18n="card_title">Cami Bulucu</div>
        <div style="font-size: 0.9rem; color: var(--text-muted);" data-i18n="card_desc">
            Çevrenizdeki camileri listeleyin veya harita üzerinde tek tıkla görüntüleyin.
        </div>
        
        <button class="action-btn" onclick="findNearbyMosquesInternal()">
            <span>📍</span> <span data-i18n="find_btn">Çevremdeki Camileri Listele</span>
        </button>

        <button class="action-btn secondary" onclick="openDirectMaps()">
            <span>🗺️</span> <span data-i18n="map_btn">Haritada (Google Maps) Aç</span>
        </button>
        
        <div class="status-text" id="statusText"></div>
    </div>

    <div class="mosque-list" id="mosqueListContainer"></div>
</div>

<script>
    const translations = {
        tr: {
            page_title: "Yakındaki Camiler | Ayetin Vakti",
            app_title: "Yakındaki Camiler",
            card_title: "Cami Bulucu",
            card_desc: "Çevrenizdeki camileri listeleyin veya harita üzerinde tek tıkla görüntüleyin.",
            find_btn: "Çevremdeki Camileri Listele",
            map_btn: "Haritada (Google Maps) Aç",
            loc_error: "Konum alınamadı. Lütfen konum izinlerini kontrol edin.",
            loc_getting: "Konumunuz alınıyor ve genişletilmiş tarama yapılıyor...",
            no_mosque: "Yakınınızda kayıtlı cami bulunamadı. Harita seçeneğini deneyebilirsiniz.",
            dir_btn: "Yol Tarifi"
        },
        en: {
            page_title: "Nearby Mosques | Ayetin Vakti",
            app_title: "Nearby Mosques",
            card_title: "Mosque Finder",
            card_desc: "List mosques around you or view them on the map with a single click.",
            find_btn: "List Mosques Around Me",
            map_btn: "Open on Google Maps",
            loc_error: "Could not get location. Please check permissions.",
            loc_getting: "Getting your location and scanning with extended range...",
            no_mosque: "No registered mosques found nearby. You can try the map option.",
            dir_btn: "Directions"
        },
        ar: {
            page_title: "المساجد القريبة | آية الوقت",
            app_title: "المساجد القريبة",
            card_title: "البحث عن المساجد",
            card_desc: "سرد المساجد من حولك أو عرضها على الخريطة بنقرة واحدة.",
            find_btn: "عرض المساجد القريبة مني",
            map_btn: "فتح على خرائط جوجل",
            loc_error: "تعذر الحصول على الموقع. يرجى التحقق من الأذونات.",
            loc_getting: "جاري تحديد موقعك والفحص بنطاق موسع...",
            no_mosque: "لم يتم العثور على مساجد مسجلة بالقرب منك. يمكنك تجربة خيار الخريطة.",
            dir_btn: "الاتجاهات"
        }
    };

    const activeLang = localStorage.getItem('user_lang') || 'tr';
    const t = translations[activeLang] || translations['tr'];

    function updateThemeButton(isLight) {
        const btn = document.getElementById('theme-btn');
        if (btn) btn.textContent = isLight ? '☀️' : '🌙';
    }

    function initTheme() {
        const savedTheme = localStorage.getItem('theme');
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const isLight = (savedTheme === 'light') || (!savedTheme && !systemPrefersDark);
        applyTheme(isLight);
    }

    function toggleTheme() {
        const isLight = document.documentElement.classList.contains('light-mode');
        applyTheme(!isLight);
    }

    function applyTheme(isLight) {
        if (isLight) {
            document.documentElement.classList.add('light-mode');
            document.body.classList.add('light-mode');
            localStorage.setItem('theme', 'light');
        } else {
            document.documentElement.classList.remove('light-mode');
            document.body.classList.remove('light-mode');
            localStorage.setItem('theme', 'dark');
        }
        updateThemeButton(isLight);
    }

    function init() {
        initTheme();
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (t[key]) {
                if (el.tagName === 'TITLE') document.title = t[key];
                else el.textContent = t[key];
            }
        });
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = 
            Math.sin(dLat/2) * Math.sin(dLat/2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
            Math.sin(dLon/2) * Math.sin(dLon/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return R * c;
    }

    function openDirectMaps() {
        if (!navigator.geolocation) {
            window.location.href = "https://www.google.com/maps/search/cami";
            return;
        }
        navigator.geolocation.getCurrentPosition(
            (pos) => {
                window.location.href = `https://www.google.com/maps/search/cami/@${pos.coords.latitude},${pos.coords.longitude},15z`;
            },
            () => {
                window.location.href = "https://www.google.com/maps/search/cami";
            },
            { timeout: 5000, enableHighAccuracy: false }
        );
    }

    function findNearbyMosquesInternal() {
        const statusEl = document.getElementById('statusText');
        const container = document.getElementById('mosqueListContainer');
        
        if (!navigator.geolocation) {
            statusEl.textContent = t.loc_error;
            return;
        }

        statusEl.textContent = t.loc_getting;
        container.innerHTML = '';

        navigator.geolocation.getCurrentPosition(
            async (position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                
                try {
                    // Tarama çapını 20 km'ye çıkarıp tüm alternatif etiketleri kapsayacak şekilde güçlendirdik
                    const query = `[out:json][timeout:20];
                    (
                      node(around:20000,${lat},${lon})[amenity=place_of_worship];
                      way(around:20000,${lat},${lon})[amenity=place_of_worship];
                      node(around:20000,${lat},${lon})[religion=muslim];
                      way(around:20000,${lat},${lon})[religion=muslim];
                      node(around:20000,${lat},${lon})["building"="mosque"];
                      way(around:20000,${lat},${lon})["building"="mosque"];
                      node(around:20000,${lat},${lon})["historic"="mosque"];
                    );
                    out body;
                    >;
                    out skel qt;`;

                    const response = await fetch('https://overpass-api.de/api/interpreter', {
                        method: 'POST',
                        body: query
                    });
                    
                    const data = await response.json();
                    statusEl.textContent = "";

                    let elements = data.elements ? data.elements.filter(item => item.lat && item.lon) : [];

                    let uniqueMosques = {};
                    elements.forEach(item => {
                        const mLat = item.lat;
                        const mLon = item.lon;
                        const tags = item.tags || {};
                        const name = tags.name || tags['name:tr'] || tags['official_name'] || tags['alt_name'] || "";
                        
                        const nameLower = name.toLowerCase();
                        // İsim filtrelemesini esneterek daha fazla yakın ibadethaneyi yakalıyoruz
                        const isMosque = nameLower.includes('cami') || 
                                         nameLower.includes('mescit') || 
                                         nameLower.includes('ibadet') ||
                                         tags.religion === 'muslim' || 
                                         tags.amenity === 'place_of_worship' ||
                                         tags.building === 'mosque';

                        if (isMosque) {
                            const key = `${mLat.toFixed(4)},${mLon.toFixed(4)}`;
                            // Eğer isim boşsa bile alternatif etiketlerden türetmeye çalışalım
                            const finalName = name || tags.amenity === 'place_of_worship' ? "Cami / Mescit" : "";
                            const dist = calculateDistance(lat, lon, mLat, mLon);
                            
                            if (finalName && (!uniqueMosques[key] || uniqueMosques[key].name === "Cami / Mescit")) {
                                uniqueMosques[key] = { name: finalName, dist, lat: mLat, lon: mLon };
                            }
                        }
                    });

                    let mosques = Object.values(uniqueMosques);
                    mosques.sort((a, b) => a.dist - b.dist);

                    if (mosques.length === 0) {
                        container.innerHTML = `
                            <div style="text-align:center; color:var(--text-muted); padding:20px; line-height: 1.6;">
                                ${t.no_mosque}<br><br>
                                <a href="https://www.google.com/maps/search/cami/@${lat},${lon},16z" target="_blank" class="action-btn" style="margin: 0 auto; display: inline-flex;">
                                    <span>🗺️</span> Google Maps'te Tam Liste Aç
                                </a>
                            </div>`;
                        return;
                    }

                    let html = '';
                    mosques.forEach(m => {
                        const distFormatted = m.dist < 1 ? `${Math.round(m.dist * 1000)} m` : `${m.dist.toFixed(1)} km`;
                        const mapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${m.lat},${m.lon}`;

                        html += `
                            <div class="mosque-item">
                                <div class="mosque-info">
                                    <div class="mosque-name">🕌 ${m.name}</div>
                                    <div class="mosque-distance">${distFormatted}</div>
                                </div>
                                <a href="${mapsUrl}" target="_blank" class="direction-btn">
                                    <span>🧭</span> ${t.dir_btn}
                                </a>
                            </div>
                        `;
                    });

                    container.innerHTML = html;

                } catch (err) {
                    statusEl.textContent = t.loc_error;
                }
            },
            (error) => {
                statusEl.textContent = t.loc_error;
            },
            { timeout: 10000, enableHighAccuracy: true }
        );
    }

    document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
