    <script>
        // Tema ve özel renk paleti (titremeyi önlemek için en başta çalışır)
        (function () {
            const d = document.documentElement;
            const savedTheme = localStorage.getItem('theme');
            const systemPrefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            const isLight = savedTheme === 'light' || (!savedTheme && !systemPrefersDark);
            if (isLight) {
                d.classList.add('light-mode');
            }
            const a = localStorage.getItem('custom_accent');
            const t = localStorage.getItem('custom_text');
            const b = localStorage.getItem('custom_bg');
            if (a) d.style.setProperty('--accent-color', a);
            if (t) d.style.setProperty('--text-color', t);
            if (b) {
                d.style.setProperty('--bg-color', b);
                d.style.setProperty('--card-bg', b);
            }
            // Özel arka plan var, yazı rengi seçilmemişse okunabilir renkleri zeminin açıklığına göre seç
            if (b && !t) {
                const m = /^#([0-9a-f]{6})$/i.exec(b.trim());
                if (m) {
                    const n = parseInt(m[1], 16);
                    const lin = c => { c /= 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
                    const L = 0.2126 * lin(n >> 16) + 0.7152 * lin((n >> 8) & 255) + 0.0722 * lin(n & 255);
                    const bgIsLight = L > 0.18;
                    d.style.setProperty('--text-color', bgIsLight ? '#0f172a' : '#f8fafc');
                    d.style.setProperty('--text-muted', bgIsLight ? '#475569' : '#cbd5e1');
                    d.style.setProperty('--border-color', bgIsLight ? 'rgba(15,23,42,0.18)' : 'rgba(248,250,252,0.22)');
                    // Buton zeminleri de zemine göre okunabilir kalsın
                    d.style.setProperty('--btn-bg', bgIsLight ? 'rgba(15,23,42,0.06)' : 'rgba(248,250,252,0.10)');
                    d.style.setProperty('--btn-hover', bgIsLight ? 'rgba(15,23,42,0.12)' : 'rgba(248,250,252,0.18)');
                }
            }
            // Safari/Chrome üst-alt çubuğu sayfa zeminine uysun
            const meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', b || (isLight ? '#f8fafc' : '#0b1120'));

            // Dil ve yön
            const currentLang = localStorage.getItem('user_lang') || 'tr';
            d.setAttribute('lang', currentLang);
            d.setAttribute('dir', currentLang === 'ar' ? 'rtl' : 'ltr');
        })();
    </script>

    // <PURE>
    function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 6371, rad = Math.PI / 180;
        const dLat = (lat2 - lat1) * rad, dLon = (lon2 - lon1) * rad;
        const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLon / 2) ** 2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function buildQuery(lat, lon, radius) {
        // DÜZELTME: nwr + "out center" ile bina çokgenleri (way/relation) de gelir; önceki sorgu bunları kaçırıyordu
        return `[out:json][timeout:20];
(
  nwr(around:${radius},${lat},${lon})["amenity"="place_of_worship"]["religion"="muslim"];
  nwr(around:${radius},${lat},${lon})["building"="mosque"];
  nwr(around:${radius},${lat},${lon})["amenity"="mosque"];
);
out center tags;`;
    }

    // OSM öğelerini cami listesine çevirir: filtre, mesafe, tekilleştirme, sıralama
    function parseMosques(elements, lat, lon, lang, defaultName) {
        const list = [];
        (elements || []).forEach(item => {
            const tags = item.tags || {};
            // DÜZELTME: Başka dinlerin ibadethaneleri (kilise, sinagog vb.) elenir
            if (tags.religion && tags.religion !== 'muslim') return;
            if (tags.amenity === 'place_of_worship' && tags.religion !== 'muslim' && tags.building !== 'mosque') return;
            const mLat = item.lat !== undefined ? item.lat : (item.center && item.center.lat);
            const mLon = item.lon !== undefined ? item.lon : (item.center && item.center.lon);
            if (typeof mLat !== 'number' || typeof mLon !== 'number') return;
            const name = (tags['name:' + lang] || tags.name || tags['name:tr'] || tags.official_name || '').trim();
            list.push({ name: name || defaultName, hasName: !!name, dist: calculateDistance(lat, lon, mLat, mLon), lat: mLat, lon: mLon });
        });
        list.sort((a, b) => a.dist - b.dist);
        // Aynı caminin düğüm + bina kaydı çift görünmesin: aynı ad 80 m içinde ya da herhangi bir kayıt 12 m içinde ise tekrar sayılır
        const out = [];
        list.forEach(m => {
            const dup = out.some(k => {
                const d = calculateDistance(k.lat, k.lon, m.lat, m.lon) * 1000;
                return d < 12 || (d < 80 && k.name.toLowerCase() === m.name.toLowerCase());
            });
            if (!dup) out.push(m);
        });
        return out;
    }
    // </PURE>

    // ===================== TEMA =====================
    function updateThemeButton() {
        const btn = document.getElementById('theme-btn');
        if (btn) btn.textContent = document.documentElement.classList.contains('light-mode') ? '☀️' : '🌙';
    }
    function updateThemeColor() {
        const meta = document.querySelector('meta[name="theme-color"]');
        if (!meta) return;
        const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg-color').trim();
        if (bg) meta.setAttribute('content', bg);
    }
    function toggleTheme() {
        const isLight = document.documentElement.classList.toggle('light-mode');
        localStorage.setItem('theme', isLight ? 'light' : 'dark');
        updateThemeButton();
        updateThemeColor();
    }

        });
        document.querySelectorAll('[data-i18n-title]').forEach(el => {
            const key = el.getAttribute('data-i18n-title');
            if (t[key]) { el.title = t[key]; el.setAttribute('aria-label', t[key]); }
        });
        document.title = t.page_title;
        updateThemeButton();
        updateThemeColor();
    }

    // ===================== KONUM =====================
    function getPosition() {
        return new Promise((resolve, reject) => {
            if (!navigator.geolocation) return reject(new Error('unsupported'));
            navigator.geolocation.getCurrentPosition(
                p => resolve({ lat: p.coords.latitude, lon: p.coords.longitude }),
                reject,
                { enableHighAccuracy: false, timeout: 12000, maximumAge: 300000 }
            );
        });
    }

    // Konum izni yoksa kayıtlı şehrin koordinatları (Aladhan meta) kullanılır
    async function savedCityPosition() {
        const saved = localStorage.getItem('user_city');
        if (!saved) return null;
        const map = { 'ç': 'c', 'ğ': 'g', 'ı': 'i', 'ö': 'o', 'ş': 's', 'ü': 'u', 'Ç': 'C', 'Ğ': 'G', 'İ': 'I', 'Ö': 'O', 'Ş': 'S', 'Ü': 'U' };
        const ascii = saved.replace(/[çğıöşüÇĞİÖŞÜ]/g, ch => map[ch]);
        try {
            const res = await fetch(`https://api.aladhan.com/v1/timingsByCity?city=${encodeURIComponent(ascii)}&country=Turkey&method=13`);
            if (!res.ok) return null;
            const j = await res.json();
            const lat = parseFloat(j.data.meta.latitude), lon = parseFloat(j.data.meta.longitude);
            return (isNaN(lat) || isNaN(lon)) ? null : { lat, lon, city: saved };
        } catch (e) { return null; }
    }

    // ===================== HARİTADA AÇ =====================
    // DÜZELTME: Uygulamadan çıkmak yerine yeni sekmede açılır; konum alınamazsa genel aramaya düşer
    function openDirectMaps() {
        const w = window.open('', '_blank');
        const go = url => { if (w) { w.location = url; } else { window.location.href = url; } };
        getPosition()
            .then(p => go(`https://www.google.com/maps/search/${encodeURIComponent(activeLang === 'ar' ? 'مسجد' : (activeLang === 'en' ? 'mosque' : 'cami'))}/@${p.lat},${p.lon},16z`))
            .catch(() => go('https://www.google.com/maps/search/cami'));
    }

    // ===================== CAMİ ARAMA =====================
    async function overpass(query) {
        let lastErr = null;
        // Tüm sunucular başarısız olursa kısa beklemeyle bir tur daha denenir
        for (let round = 0; round < 2; round++) {
            if (round) await new Promise(r => setTimeout(r, 1500));
            for (const url of ENDPOINTS) {
                const ctrl = new AbortController();
                const to = setTimeout(() => ctrl.abort(), 18000);
                try {
                    const res = await fetch(url, {
                        method: 'POST', signal: ctrl.signal,
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
                        body: 'data=' + encodeURIComponent(query)
                    });
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    const data = await res.json();
                    if (!data || !Array.isArray(data.elements)) throw new Error('Geçersiz yanıt');
                    return data.elements;
                } catch (e) {
                    lastErr = new Error((e.name === 'AbortError' ? 'zaman aşımı' : e.message) + ' @ ' + new URL(url).hostname);
                    console.warn('Overpass hatası:', lastErr.message);
                } finally { clearTimeout(to); }
            }
        }
        throw lastErr || new Error('Overpass erişilemedi');
    }

    let currentList = [], shown = 0, maxKm = Infinity;
    const FILTERS = [Infinity, 0.5, 1, 3];

    function setStatus(text, isError) {
        const el = document.getElementById('statusText');
        el.textContent = text; el.classList.toggle('error', !!isError);
    }

    function showSkeleton() {
        const c = document.getElementById('mosqueListContainer');
        c.innerHTML = '';
        for (let i = 0; i < 4; i++) { const d = document.createElement('div'); d.className = 'skeleton'; c.appendChild(d); }
    }

    function visibleList() { return currentList.filter(m => m.dist <= maxKm); }

    function buildChips() {
        const box = document.getElementById('chips');
        box.innerHTML = '';
        FILTERS.forEach(v => {
            const b = document.createElement('button');
            b.className = 'chip fin-btn' + (v === maxKm ? ' active' : '');
            b.textContent = v === Infinity ? t.chip_all : (v < 1 ? `${v * 1000} m` : `${v} km`);
            b.onclick = () => { maxKm = v; buildChips(); renderList(); };
            box.appendChild(b);
        });
        box.classList.add('on');
    }

    function renderList() {
        document.getElementById('mosqueListContainer').innerHTML = '';
        shown = 0;
        if (visibleList().length === 0) {
            const e = document.createElement('div'); e.className = 'empty-note'; e.textContent = t.filter_empty;
            document.getElementById('mosqueListContainer').appendChild(e); return;
        }
        renderMore();
    }

    function renderMore() {
        const container = document.getElementById('mosqueListContainer');
        const old = container.querySelector('.more-btn'); if (old) old.remove();
        const list = visibleList();
        const slice = list.slice(shown, shown + PAGE_SIZE);
        slice.forEach((m, i) => {
            const item = document.createElement('div'); item.className = 'mosque-item' + (m.nearest ? ' nearest' : '');
            item.style.setProperty('--i', i);
            const rank = document.createElement('div'); rank.className = 'rank'; rank.textContent = shown + i + 1;
            const info = document.createElement('div'); info.className = 'mosque-info';
            const name = document.createElement('div'); name.className = 'mosque-name'; name.textContent = m.name;   // textContent (HTML enjeksiyonu yok)
            const meta = document.createElement('div'); meta.className = 'meta';
            const dist = document.createElement('span'); dist.className = 'pill dist';
            dist.textContent = m.dist < 1 ? `${Math.round(m.dist * 1000)} m` : `${m.dist.toFixed(1)} km`;
            meta.appendChild(dist);
            if (m.dist <= 3) {   // yürüyüş süresi yaklaşık değerdir (5 km/sa kuş uçuşu)
                const w = document.createElement('span'); w.className = 'pill';
                w.textContent = '🚶 ' + t.walk.replace('{n}', Math.max(1, Math.round(m.dist / 5 * 60)));
                meta.appendChild(w);
            }
            if (m.nearest) { const n = document.createElement('span'); n.className = 'pill near'; n.textContent = t.nearest; meta.appendChild(n); }
            info.append(name, meta);
            const a = document.createElement('a'); a.className = 'direction-btn'; a.target = '_blank'; a.rel = 'noopener';
            a.href = `https://www.google.com/maps/dir/?api=1&destination=${m.lat},${m.lon}`;
            a.textContent = '🧭 ' + t.dir_btn;
            item.append(rank, info, a); container.appendChild(item);
        });
        shown += slice.length;
        if (shown < list.length) {
            const btn = document.createElement('button'); btn.className = 'action-btn secondary more-btn fin-btn'; btn.textContent = t.more_btn;
            btn.onclick = renderMore; container.appendChild(btn);
        }
    }

    function showNoResult(pos) {
        const container = document.getElementById('mosqueListContainer');
        const frameContainer = document.getElementById('mapFrameContainer');
        container.innerHTML = '';
        const msg = document.createElement('div');
        msg.style.cssText = 'text-align:center; color:var(--text-muted); padding:15px; line-height:1.6;';
        msg.textContent = t.no_mosque; container.appendChild(msg);
        document.getElementById('googleMapFrame').src = `https://maps.google.com/maps?q=cami&sll=${pos.lat},${pos.lon}&sspn=0.01,0.01&t=m&z=16&output=embed`;
        frameContainer.style.display = 'block';
    }

    async function findNearbyMosques() {
        const btn = document.getElementById('findBtn');
        const container = document.getElementById('mosqueListContainer');
        document.getElementById('mapFrameContainer').style.display = 'none';
        container.innerHTML = ''; currentList = []; shown = 0; maxKm = Infinity;
        document.getElementById('chips').classList.remove('on');
        btn.disabled = true;
        try {
            setStatus(t.loc_getting, false);
            let pos = null, note = '';
            try { pos = await getPosition(); }
            catch (e) {
                const fb = await savedCityPosition();
                if (fb) { pos = fb; note = `${t.saved_city} ${fb.city}`; }
            }
            if (!pos) { setStatus(t.loc_error, true); return; }

            // Sonuç yetersizse yarıçap kademeli genişler (1.5 → 4 → 10 → 20 km)
            showSkeleton();
            let mosques = [];
            for (const r of RADII) {
                setStatus(t.scanning.replace('{km}', (r / 1000).toString().replace('.', activeLang === 'tr' ? ',' : '.')), false);
                let elements;
                try { elements = await overpass(buildQuery(pos.lat, pos.lon, r)); }
                catch (e) { if (mosques.length) break; throw e; }   // geniş yarıçap başarısız olursa eldeki sonuçlar gösterilir
                mosques = parseMosques(elements, pos.lat, pos.lon, activeLang, t.default_name);
                if (mosques.length >= MIN_RESULTS) break;
            }

            if (mosques.length === 0) { setStatus(note, false); showNoResult(pos); return; }
            mosques.forEach((m, i) => { m.nearest = i === 0; });
            currentList = mosques;
            setStatus((note ? note + '\n' : '') + t.found.replace('{n}', mosques.length) + '\n' + t.dist_note, false);
            buildChips();
            renderList();
        } catch (err) {
            console.error('Cami arama hatası:', err);
            container.innerHTML = '';
            setStatus(t.net_error + '\n(' + String(err && err.message || err) + ')', true);
        } finally {
            btn.disabled = false;
        }
    }

    document.addEventListener('DOMContentLoaded', init);
</script>
