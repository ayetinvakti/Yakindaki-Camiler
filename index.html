<!DOCTYPE html>
<html lang="tr">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <script>
        const savedTheme = localStorage.getItem('theme');
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (savedTheme === 'light' || (!savedTheme && !systemPrefersDark)) {
            document.documentElement.classList.add('light-mode');
            document.body && document.body.classList.add('light-mode');
        }

        const savedAccent = localStorage.getItem('custom_accent');
        const savedBg = localStorage.getItem('custom_bg');
        const savedText = localStorage.getItem('custom_text');

        if (savedAccent) document.documentElement.style.setProperty('--accent-color', savedAccent);
        if (savedBg) {
            document.documentElement.style.setProperty('--bg-color', savedBg);
            document.documentElement.style.setProperty('--card-bg', savedBg);
        }
        if (savedText) document.documentElement.style.setProperty('--text-color', savedText);

        const currentLang = localStorage.getItem('user_lang') || 'tr';
        if (currentLang === 'ar') {
            document.documentElement.setAttribute('dir', 'rtl');
        } else {
            document.documentElement.setAttribute('dir', 'ltr');
        }
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title data-i18n="page_title">Yakındaki Camiler | Ayetin Vakti</title>
    
    <style>
        :root {
            --bg-color: #0b1120;
            --card-bg: #1e293b;
            --accent-color: #10b981;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --btn-bg: rgba(255, 255, 255, 0.05);
            --btn-hover: rgba(255, 255, 255, 0.1);
        }

        html.light-mode, body.light-mode {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --accent-color: #059669;
            --text-color: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --btn-bg: #f1f5f9;
            --btn-hover: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container {
            width: 100%;
            max-width: 700px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .navbar {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
        }

        .home-btn, .theme-icon-btn {
            background-color: var(--btn-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        .home-btn:hover, .theme-icon-btn:hover {
            background-color: var(--btn-hover);
        }

        .app-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-color);
            text-align: center;
            flex: 1;
        }

        .mosque-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .mosque-icon {
            font-size: 3rem;
            margin-bottom: -5px;
        }

        .mosque-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent-color);
        }

        .mosque-desc {
            font-size: 0.95rem;
            color: var(--text-muted);
            line-height: 1.5;
            max-width: 500px;
        }

        .action-btn {
            width: 100%;
            max-width: 320px;
            padding: 14px 20px;
            border-radius: 14px;
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s ease, transform 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
        }

        .action-btn:active {
            transform: scale(0.98);
        }

        .action-btn:hover {
            opacity: 0.9;
        }

        .status-text {
            font-size: 0.85rem;
            color: var(--text-muted);
            min-height: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <header class="navbar">
        <a href="../" class="home-btn" title="Ana Sayfa">←</a>
        <div class="app-title" data-i18n="app_title">Yakındaki Camiler</div>
        <button class="theme-icon-btn" onclick="toggleTheme()" id="theme-btn" title="Tema Değiştir">☀️</button>
    </header>

    <div class="mosque-card">
        <div class="mosque-icon">🕌</div>
        <div class="mosque-title" data-i18n="card_title">Cami Bulucu</div>
        <div class="mosque-desc" data-i18n="card_desc">
            Bulunduğunuz konuma en yakın camileri harita üzerinde listeleyebilir, yol tarifi alarak kolayca ulaşabilirsiniz.
        </div>
        
        <button class="action-btn" onclick="findNearbyMosques()">
            <span>📍</span> <span data-i18n="find_btn">En Yakın Camileri Bul</span>
        </button>
        
        <div class="status-text" id="statusText"></div>
    </div>
</div>

<script>
    const translations = {
        tr: {
            page_title: "Yakındaki Camiler | Ayetin Vakti",
            app_title: "Yakındaki Camiler",
            card_title: "Cami Bulucu",
            card_desc: "Bulunduğunuz konuma en yakın camileri harita üzerinde listeleyebilir, yol tarifi alarak kolayca ulaşabilirsiniz.",
            find_btn: "En Yakın Camileri Bul",
            loc_error: "Konumunuza ulaşılamadı. Lütfen konum izinlerini kontrol edin.",
            loc_getting: "Konumunuz alınıyor, haritaya yönlendiriliyorsunuz..."
        },
        en: {
            page_title: "Nearby Mosques | Ayetin Vakti",
            app_title: "Nearby Mosques",
            card_title: "Mosque Finder",
            card_desc: "Find the mosques closest to your location on the map and easily get directions.",
            find_btn: "Find Nearest Mosques",
            loc_error: "Could not access your location. Please check permissions.",
            loc_getting: "Getting your location, redirecting to map..."
        },
        ar: {
            page_title: "المساجد القريبة | آية الوقت",
            app_title: "المساجد القريبة",
            card_title: "البحث عن المساجد",
            card_desc: "اعثر على أقرب المساجد إلى موقعك على الخريطة واحصل على الاتجاهات بسهولة.",
            find_btn: "ابحث عن أقرب مسجد",
            loc_error: "تعذر الوصول إلى موقعك. يرجى التحقق من أذونات الموقع.",
            loc_getting: "جاري تحديد موقعك، يتم توجيهك إلى الخريطة..."
        }
    };

    const activeLang = localStorage.getItem('user_lang') || 'tr';
    const t = translations[activeLang] || translations['tr'];

    function updateThemeButton(isLight) {
        const btn = document.getElementById('theme-btn');
        if (btn) {
            btn.textContent = isLight ? '☀️' : '🌙';
        }
    }

    function initTheme() {
        const savedTheme = localStorage.getItem('theme');
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const isLight = (savedTheme === 'light') || (!savedTheme && !systemPrefersDark);
        applyTheme(isLight);
    }

    function toggleTheme() {
        const isLight = document.documentElement.classList.contains('light-mode');
        applyTheme(!isLight);
    }

    function applyTheme(isLight) {
        if (isLight) {
            document.documentElement.classList.add('light-mode');
            document.body.classList.add('light-mode');
            localStorage.setItem('theme', 'light');
        } else {
            document.documentElement.classList.remove('light-mode');
            document.body.classList.remove('light-mode');
            localStorage.setItem('theme', 'dark');
        }
        updateThemeButton(isLight);
    }

    function init() {
        initTheme();

        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (t[key]) {
                if (el.tagName === 'TITLE') document.title = t[key];
                else el.textContent = t[key];
            }
        });
    }

    function findNearbyMosques() {
        const statusEl = document.getElementById('statusText');
        
        if (!navigator.geolocation) {
            statusEl.textContent = t.loc_error;
            return;
        }

        statusEl.textContent = t.loc_getting;

        navigator.geolocation.getCurrentPosition(
            (position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                statusEl.textContent = "";
                
                // Google Maps arama URL'si
                const mapsUrl = `https://www.google.com/maps/search/cami/@${lat},${lon},15z`;
                window.open(mapsUrl, '_blank');
            },
            (error) => {
                statusEl.textContent = t.loc_error;
            },
            { timeout: 10000, enableHighAccuracy: true }
        );
    }

    document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
